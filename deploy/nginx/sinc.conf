#
# nginx site for Sinc API (TLS termination, reverse proxy to Docker port 3000).
# Installed on the Hostinger VPS as /etc/nginx/sites-available/sinc
#
# Replace: SERVER_NAME (your domain) and set up your A/AAAA record to point at
# the VPS IP before running `certbot` (see deploy-hostinger.sh proxy).
#

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Let's Encrypt HTTP-01 challenge endpoint.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME;

    # Managed by certbot (run certonly --webroot).
    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Reverse proxy to the Sinc API container (published host port 3000).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow streaming download responses / SSE if the app needs it later.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Large download/artwork bodies.
        client_max_body_size 200m;
    }
}
