name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  SINC_KEYSTORE_BASE64: ${{ secrets.SINC_KEYSTORE_BASE64 }}
  SINC_KEYSTORE_PASSWORD: ${{ secrets.SINC_KEYSTORE_PASSWORD }}
  SINC_KEY_ALIAS: ${{ secrets.SINC_KEY_ALIAS }}
  SINC_KEY_PASSWORD: ${{ secrets.SINC_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version from tag
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJ MIN PAT <<< "${VERSION_NAME}"
          VERSION_CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Verify APP_VERSION matches the tag
        run: |
          if ! grep -q "APP_VERSION = '${VERSION_NAME}'" \
            apps/mobile/src/services/updates/appUpdates.ts; then
            echo "APP_VERSION in apps/mobile/src/services/updates/appUpdates.ts does not match tag ${GITHUB_REF_NAME}." >&2
            echo "Bump APP_VERSION to ${VERSION_NAME} and commit before tagging." >&2
            exit 1
          fi

      - name: Decode release keystore
        run: |
          if [ -n "$SINC_KEYSTORE_BASE64" ]; then
            echo "$SINC_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/release.keystore
            echo "SINC_KEYSTORE_FILE=apps/mobile/android/app/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::SINC_KEYSTORE_BASE64 is not set — signing with the debug key."
            echo "Set the four SINC_KEYSTORE_* secrets (see scripts/generate-release-keystore.sh)."
          fi

      - name: Build release APK
        run: ./gradlew :app:assembleRelease \
          -PversionCode="${VERSION_CODE}" \
          -PversionName="${VERSION_NAME}"
        working-directory: apps/mobile/android

      - name: Rename APK
        run: |
          cp \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "sinc-${VERSION_NAME}-${VERSION_CODE}.apk"

      - name: Publish release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "sinc ${VERSION_NAME}" \
            --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            "sinc-${VERSION_NAME}-${VERSION_CODE}.apk"
        env:
          GH_TOKEN: ${{ github.token }}